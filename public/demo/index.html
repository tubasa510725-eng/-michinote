<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミチノート 試作</title>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{box-sizing:border-box}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Klee+One:wght@600&display=swap">
<style>
/* Layout: phone-shaped app (map on top, working panel below, tab bar) with a concept column beside it on wide screens */
:root{
  --bg:#ece9dc; --paper:#fbfaf4; --card:#ffffff; --ink:#1d2a21; --muted:#5d6a5f; --line:#dcd8c6;
  --brand:#1f4a32; --brand-ink:#f4f1e6; --road:#2c8a3c; --orange:#df6c1c; --orange-soft:#fbe6d4;
  --land:#f8f6ec; --land-navi:#e4efd8; --sea:#cde2e3; --lake:#cfe3e6; --faint:#cfcab4; --border-line:#e3dfcc;
  --hwy:#4a7fc9; --nat:#f2c14e; --chip:#eef0e4; --shadow:0 18px 50px rgba(31,74,50,.18);
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-hand:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --paper:#161e18; --card:#1c261f; --ink:#e7eadf; --muted:#9ba696; --line:#2e3a31;
  --brand:#1d3f2b; --brand-ink:#eef0e4; --road:#5cc46b; --orange:#f08a3a; --orange-soft:#3a2617;
  --land:#1a221c; --land-navi:#1f2c21; --sea:#132a32; --lake:#163038; --faint:#38433a; --border-line:#26302a;
  --hwy:#6d9be0; --nat:#c9a246; --chip:#232e26; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1511; --paper:#161e18; --card:#1c261f; --ink:#e7eadf; --muted:#9ba696; --line:#2e3a31;
  --brand:#1d3f2b; --brand-ink:#eef0e4; --road:#5cc46b; --orange:#f08a3a; --orange-soft:#3a2617;
  --land:#1a221c; --land-navi:#1f2c21; --sea:#132a32; --lake:#163038; --faint:#38433a; --border-line:#26302a;
  --hwy:#6d9be0; --nat:#c9a246; --chip:#232e26; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.stage{height:100%;display:flex;justify-content:center;align-items:center;gap:48px;padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.concept{max-width:340px;display:flex;flex-direction:column;gap:18px}
.concept .logo{font-size:22px}
.concept h1{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1.25;margin:0;text-wrap:balance}
.concept h1 em{font-style:normal;color:var(--orange)}
.concept p{margin:0;color:var(--muted)}
.concept ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.concept .scope{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.concept .scope b{color:var(--brand)}
:root[data-theme="dark"] .concept .scope b{color:var(--road)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--orange);color:#fff;font-weight:700}

.app{width:min(420px,100%);height:min(860px,100%);background:var(--paper);border-radius:34px;box-shadow:var(--shadow);
  border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (max-width:860px){
  .concept{display:none}
  .stage{padding:0}
  .app{width:100%;height:100%;border-radius:0;border:0;box-shadow:none}
}

header.top{background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:.04em}
.logo svg{flex:none}
.modes{display:flex;background:rgba(255,255,255,.12);border-radius:99px;padding:3px}
.modes button{border:0;background:none;color:inherit;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center}
.modes button[aria-pressed="true"]{background:var(--paper);color:var(--brand)}
:root[data-theme="dark"] .modes button[aria-pressed="true"]{color:var(--road)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .modes button[aria-pressed="true"]{color:var(--road)}}

.mapwrap{position:relative;flex:0 0 44%;background:var(--land);border-bottom:1px solid var(--line);overflow:hidden}
.mapwrap svg{width:100%;height:100%;display:block;touch-action:manipulation}
.mapcap{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.mapcap span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.mapcap .rec{background:#c2361b;color:#fff;border-color:#c2361b}
.legend{position:absolute;right:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11px;display:flex;flex-direction:column;gap:2px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

.panel{flex:1;overflow-y:auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
.panel h2{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0;line-height:1.3;text-wrap:balance}
.panel h2 u{text-decoration:none;background:linear-gradient(transparent 70%,var(--orange-soft) 70%)}
.panel h3{font-size:14px;margin:0;font-weight:700}
.lead{margin:0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat small{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stat b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat b span{font-size:12px;font-weight:500;margin-left:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.block{width:100%}
.btn.small{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.danger{color:#c2361b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{display:flex;gap:8px;font-size:12px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 10px;align-items:flex-start}
.note svg{flex:none;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--muted)}
.chip.sample{background:var(--orange-soft);color:var(--orange)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.howto{display:flex;flex-direction:column;gap:10px}
.howto div{display:flex;gap:10px;align-items:flex-start}
.howto .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.howto p{margin:0;font-size:13px}
.howto p b{display:block;font-size:14px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.cand{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.cand[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.cand .t{font-weight:900;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.cand .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}
.cand .meta b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.cand .why{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:12px}
.cand .why b{color:var(--orange)}

.reclive{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.reclive .now{font-size:12px;color:var(--muted)}
.reclive .now b{display:block;font-size:20px;color:var(--ink);font-family:var(--f-display);font-weight:900}
.nexts{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#c2361b;display:inline-block;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

.ride{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;width:100%;align-items:center}
.ride .thumb{flex:none;width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--land)}
.ride .thumb img,.ride .thumb svg{width:100%;height:100%;object-fit:cover;display:block}
.ride .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.ride .info b{font-size:15px}
.ride .info small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

.postcard{background:var(--card);border-radius:14px;padding:14px;position:relative;display:flex;flex-direction:column;gap:10px;
  border:8px solid transparent;background-clip:padding-box;box-shadow:0 0 0 1px var(--line)}
.postcard::before{content:"";position:absolute;inset:-8px;z-index:-1;border-radius:18px;
  background:repeating-linear-gradient(135deg,var(--orange) 0 10px,var(--card) 10px 16px,#4c8fb0 16px 26px,var(--card) 26px 32px)}
.postwrap{position:relative;z-index:0}
.postcard .hand{font-family:var(--f-hand);font-size:20px;color:var(--brand);line-height:1.4}
:root[data-theme="dark"] .postcard .hand{color:var(--road)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .postcard .hand{color:var(--road)}}
.postcard .msg{font-family:var(--f-hand);font-size:15px}
.postcard img{width:100%;height:130px;object-fit:cover;border-radius:10px;display:block}
.postcard .mini{height:120px;border-radius:10px;overflow:hidden;background:var(--land);border:1px solid var(--line)}
.postcard .mini svg{width:100%;height:100%;display:block}
.postcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.postcard dt{color:var(--muted)}
.postcard dd{margin:0}

.ridepick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.ridepick button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-size:12px;text-align:left}
.ridepick button[aria-pressed="true"]{border-color:var(--orange)}
.ridepick small{display:block;color:var(--muted)}

nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--paper);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--orange)}

.sheet-bg{position:absolute;inset:0;background:rgba(10,20,14,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--paper);width:100%;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:14px;
  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0}
.spotedit{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.spotedit img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.spotedit .field{flex:1;min-width:0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.album-hero{height:150px;border-radius:16px;overflow:hidden;position:relative}
.album-hero img{width:100%;height:100%;object-fit:cover}
.album-hero div{position:absolute;inset:auto 0 0 0;padding:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.album-hero b{font-family:var(--f-display);font-size:20px;font-weight:900;display:block}
.timeline{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--road);margin-left:8px;padding-left:16px}
.timeline .ev{position:relative;padding-bottom:14px;display:flex;gap:10px;align-items:center}
.timeline .ev::before{content:"";position:absolute;left:-23px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:3px solid var(--road)}
.timeline img{width:90px;height:60px;border-radius:10px;object-fit:cover;flex:none}
.timeline small{color:var(--muted);display:block}

.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;
  z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90%;text-align:center}

/* map styling */
.m-sea{fill:var(--sea)} .m-land{fill:var(--land)} .navi .m-land{fill:var(--land-navi)} .m-lake{fill:var(--lake)}
.m-coast{fill:none;stroke:var(--faint);stroke-width:1}
.m-border{fill:none;stroke:var(--border-line);stroke-width:1;stroke-dasharray:4 3}
.m-contour{fill:none;stroke:var(--border-line);stroke-width:.8}
.navi .m-contour{stroke:var(--faint);opacity:.5}
.r-faint{fill:none;stroke:var(--faint);stroke-width:1.4;stroke-dasharray:2 3;stroke-linecap:round}
.r-case{fill:none;stroke:var(--faint);stroke-width:5;stroke-linecap:round}
.r-navi{fill:none;stroke:var(--card);stroke-width:3;stroke-linecap:round}
.r-navi.hwy{stroke:var(--hwy)} .r-navi.nat{stroke:var(--nat)} .r-navi.narrow{stroke-dasharray:3 2}
.r-done{fill:none;stroke:var(--road);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.navi .r-done{stroke-width:2.2;opacity:.85}
.r-new{fill:none;stroke:var(--orange);stroke-width:4;stroke-linecap:round}
.r-plan-old{fill:none;stroke:var(--road);stroke-width:4.5;stroke-linecap:round}
.r-wish{fill:none;stroke:var(--orange);stroke-width:2.4;stroke-dasharray:5 4;stroke-linecap:round}
.r-rec{fill:none;stroke:#c2361b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.r-guide{fill:none;stroke:var(--orange);stroke-width:3;stroke-dasharray:1 6;stroke-linecap:round}
.replay{fill:none;stroke:var(--road);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease-in-out forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.pinfade{opacity:0;animation:fade .5s forwards;animation-delay:var(--d,0s)}
@keyframes fade{to{opacity:1}}
.lbl{font-size:9px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.navi .lbl{stroke:var(--land-navi)}
.lbl.muted{fill:var(--muted);font-weight:500}
.home-zone{fill:var(--orange);fill-opacity:.07;stroke:var(--orange);stroke-width:1;stroke-dasharray:3 3}
.home-dot{fill:var(--brand);stroke:var(--card);stroke-width:2}
.node-tap{fill:var(--orange);fill-opacity:.9;stroke:var(--card);stroke-width:2;cursor:pointer}
.node-ring{fill:none;stroke:var(--orange);stroke-width:2;animation:pulse 1.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
.pin-body{fill:var(--card);stroke:var(--brand);stroke-width:1.5}
@media (prefers-reduced-motion: reduce){
  .replay{animation:none;stroke-dashoffset:0} .pinfade{animation:none;opacity:1} .node-ring,.dot{animation:none}
}
</style>
</head>
<body>

<div class="stage">
  <aside class="concept">
    <div class="logo"><svg width="34" height="24" viewBox="0 0 34 24" aria-hidden="true"><path d="M1 21 L11 6 L17 13 L22 7 L33 21" fill="none" stroke="var(--orange)" stroke-width="2.6" stroke-linejoin="round"/><path d="M6 23 C14 17, 20 22, 28 16" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linecap="round"/></svg>ミチノート <span class="tag">試作 v0.1</span></div>
    <h1>走った道で、<br><em>自分だけの地図</em>が育つ。</h1>
    <p>バイクの旅を白地図に残し、まだ走っていない道を次の冒険として提案するアプリの動く試作です。</p>
    <div class="scope">
      <b>この試作で触れる機能</b>
      <ol>
        <li>白地図（マイ地図）とナビ地図の切り替え</li>
        <li>走行記録と写真・立ち寄りスポット</li>
        <li>未走行区間を使ったルート提案</li>
        <li>道の招待状（送る・受け取る）</li>
      </ol>
    </div>
    <p style="font-size:12px">地図は架空の地域です。走行はタップで道をたどる疑似記録で、GPSは使いません。データはこのブラウザ内だけに保存されます。</p>
  </aside>

  <div class="app" id="app">
    <header class="top">
      <div class="logo"><svg width="30" height="22" viewBox="0 0 34 24" aria-hidden="true"><path d="M1 21 L11 6 L17 13 L22 7 L33 21" fill="none" stroke="var(--orange)" stroke-width="2.6" stroke-linejoin="round"/><path d="M6 23 C14 17, 20 22, 28 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>ミチノート</div>
      <div class="modes" role="group" aria-label="地図の種類">
        <button id="m-navi" aria-pressed="false">ナビ地図</button>
        <button id="m-white" aria-pressed="true">マイ地図<small style="font-weight:500;opacity:.8">(白地図)</small></button>
      </div>
    </header>
    <div class="mapwrap" id="mapwrap"></div>
    <section class="panel" id="panel" aria-live="polite"></section>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>

<script>
(() => {
/* ---------- 地図データ（架空の地域） ---------- */
const N = {
  home:[90,400,'自宅','town'], A:[150,380,'駅前','town'], B:[210,410,'川沿いの町','town'], C:[280,452,'港町','coast'],
  D:[336,382,'岬の展望台','coast'], E:[312,302,'海の駅','cafe'], F:[306,228,'灯台','coast'], G:[272,150,'白浜','coast'],
  H:[248,72,'北の漁港','coast'], I:[228,252,'茶屋の峠','mtn'], J:[178,302,'里山','field'], K:[118,318,'棚田','field'],
  L:[48,300,'西の谷','field'], M:[72,178,'湖畔','lake'], N:[156,158,'湖の東','cafe'], O:[204,128,'高原牧場','mtn'],
  P:[128,88,'山頂ゲート','mtn'], Q:[52,96,'源流の村','field'], R:[168,470,'南IC','town']
};
const CAFE = new Set(['E','N','C','D']);

/* ---------- 走行記録（疑似） ---------- */
let animating=false;
function step(to){
  if(!U.rec || animating) return; const from=U.rec.path.at(-1); if(!ADJ[from].includes(to)) return;
  const e=EK[k(from,to)], A=N[from], B=N[to]; animating=true;
  const bike=document.getElementById('bike'), t0=performance.now(), dur=reduce?0:650;
  const tick=now=>{ const t=dur?Math.min(1,(now-t0)/dur):1, u=1-t;
    const x=u*u*A[0]+2*u*t*e.cx+t*t*B[0], y=u*u*A[1]+2*u*t*e.cy+t*t*B[1];
    if(bike) bike.setAttribute('transform',`translate(${x} ${y})`);
    if(t<1) requestAnimationFrame(tick); else { animating=false; U.rec.path.push(to); U.rec.clock+=mins(e); render(); if(U.rec.auto) setTimeout(autoStep, reduce?50:250); } };
  requestAnimationFrame(tick);
}
function autoStep(){
  if(!U.rec||!U.rec.auto) return; const g=U.rec.guide, i=U.rec.path.length;
  if(g && i<g.length){ step(g[i]); return; }
  U.rec.auto=false; render(); toast('ルートを走り終えました。「走行を終える」で保存できます');
}
function startRec(guide){ U.rec={path:['home'],spots:[],clock:0,start:new Date(),guide:guide||null,auto:false}; U.tab='rec'; render(); }

/* ---------- ルート提案 ---------- */
function suggest(){
  const {time,mood,avoid}=U.form, budget=(+time)*60*0.8, tv=traveled(), wish=new Set(S.wish);
  const allowed = e => !(avoid==='narrow' && e.type==='narrow') && !(avoid==='hwy' && e.type==='hwy');
  const moodHit = (e,n) => mood==='sea'?e.type==='coast': mood==='mtn'?(e.type==='mtn'||e.type==='narrow'): mood==='lake'?e.type==='lake'||(['M','N'].includes(n)) : CAFE.has(n);
  const found=[]; let steps=0;
  const dfs=(node,path,used,t)=>{
    if(++steps>60000) return;
    for(const nb of ADJ[node]){ const e=EK[k(node,nb)]; if(used.has(e.key)||!allowed(e)) continue; const nt=t+mins(e); if(nt>budget) continue;
      if(nb==='home'){ if(path.length>=3) found.push([...path,'home']); continue; }
      if(path.includes(nb)) continue;
      used.add(e.key); path.push(nb); dfs(nb,path,used,nt); path.pop(); used.delete(e.key); }
  };
  dfs('home',['home'],new Set(),0);
  const scored = found.map(p=>{ const es=edgesOf(p).map(x=>EK[x]); let nw=0,md=0,ws=0; es.forEach((e,i)=>{ if(!tv.has(e.key)) nw+=e.km; if(moodHit(e,p[i+1])) md+=e.km; if(wish.has(e.key)) ws+=e.km; });
    const t=minOf(p); const fill=t/budget; const hw=es.filter(e=>e.type==='hwy').reduce((a,e)=>a+e.km,0); return {path:p,nw,md,ws,t,score:nw*2.5+md*3+ws*5-hw*2+(fill>.55?8:0)}; }).sort((a,b)=>b.score-a.score);
  const pick=[]; for(const c of scored){ const s=new Set(edgesOf(c.path)); if(pick.every(p=>{ const o=edgesOf(p.path).filter(x=>s.has(x)).length; return o/Math.max(s.size,1)<.55; })) pick.push(c); if(pick.length===3) break; }
  U.cands = pick.map(c=>describe(c,tv,mood)); U.selCand=0;
}
function describe(c,tv,mood){
  const es=edgesOf(c.path).map(x=>EK[x]);
  const newRoads={}; es.forEach(e=>{ if(!tv.has(e.key)) newRoads[e.name]=(newRoads[e.name]||0)+e.km; });
  const top=Object.entries(newRoads).sort((a,b)=>b[1]-a[1])[0];
  let lead=null; if(top){ const idx=es.findIndex(e=>e.name===top[0]); for(let i=idx-1;i>=0;i--) if(tv.has(es[i].key)){ lead=es[i].name; break; } }
  const stops=c.path.filter(n=>CAFE.has(n)).filter((v,i,a)=>a.indexOf(v)===i).map(n=>N[n][2]);
  const kinds=es.reduce((m,e)=>(m[e.type]=(m[e.type]||0)+e.km,m),{});
  const far=c.path.reduce((a,n)=>Math.hypot(N[n][0]-N.home[0],N[n][1]-N.home[1])>Math.hypot(N[a][0]-N.home[0],N[a][1]-N.home[1])?n:a,'home');
  const mainType=Object.entries(kinds).sort((a,b)=>b[1]-a[1])[0][0];
  const base = c.ws>0 ? '招待状の道をたどる' : mood==='cafe'&&stops.length ? `${stops[0]}に寄るカフェ` : mood==='sea'&&c.md>5 ? '海沿いを走る' : mood==='mtn'&&c.md>5 ? '峠をつなぐ' : mood==='lake'&&c.md>2 ? '湖をめぐる' : ({coast:'海沿いを走るルート',mtn:'峠と高原のルート',narrow:'山あいの静かなルート',lake:'湖をひと回りするルート',nat:'のんびり国道ルート',cty:'里山をつなぐルート',hwy:'高速で遠くへ行くルート'})[mainType].replace('ルート','');
  const title = `${base}ルート（${N[far][2]}まで）`;
  let why = top ? (lead ? `いつもの「${esc(lead)}」の先に、まだ走っていない「${esc(top[0])}」が<b>${top[1].toFixed(1)}km</b>あります。` : `まだ走っていない「${esc(top[0])}」を<b>${top[1].toFixed(1)}km</b>走れます。`) : '全区間が走ったことのある道です。慣れた道でゆっくり走れます。';
  if(c.ws>0) why += `ソラから届いた招待状の道を${c.ws.toFixed(1)}km通ります。`;
  else if(c.md>3) why += ({sea:'海沿いの区間',mtn:'峠道',lake:'湖畔の道',cafe:'カフェのある道'})[mood]+`が${c.md.toFixed(0)}kmあります。`;
  return {...c,title,why,stops,km:kmOf(c.path),rest:Math.max(15,Math.round(c.t*0.25/5)*5)};
}

function readPhoto(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
  const s=Math.min(1,360/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.72)); }; img.src=fr.result; }; fr.readAsDataURL(file); }); }

function miniMap(path, hide){
  const xs=path.map(n=>N[n][0]), ys=path.map(n=>N[n][1]); const pad=30;
  let x0=Math.min(...xs)-pad,y0=Math.min(...ys)-pad,w=Math.max(...xs)-x0+pad,h=Math.max(...ys)-y0+pad; const r=w/h, tr=3; if(r<tr){ const nw=h*tr; x0-=(nw-w)/2; w=nw; } else { const nh=w/tr; y0-=(nh-h)/2; h=nh; }
  const [hx,hy]=N.home, maskId='mk'+Math.random().toString(36).slice(2,7);
  const near = hide && hx>x0-40 && hx<x0+w+40 && hy>y0-40 && hy<y0+h+40;
  return `<svg viewBox="${x0} ${y0} ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ルートの地図">
    <defs><mask id="${maskId}"><rect x="-500" y="-500" width="1500" height="1500" fill="#fff"/>${near?`<circle cx="${hx}" cy="${hy}" r="34" fill="#000"/>`:''}</mask>
    <pattern id="h${maskId}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" fill="var(--faint)"/></pattern></defs>
    <rect class="m-sea" x="-500" y="-500" width="1500" height="1500"/><path class="m-land" d="${LAND_D}"/>
    ${E.map(e=>`<path class="r-faint" d="${edgeD(e)}"/>`).join('')}
    <g mask="url(#${maskId})"><path class="r-done" style="stroke-width:5" d="${pathD(path)}"/></g>
    ${near?`<circle cx="${hx}" cy="${hy}" r="34" fill="url(#h${maskId})" stroke="var(--faint)" stroke-dasharray="3 3"/><text class="lbl muted" x="${hx}" y="${hy+3}" text-anchor="middle">非表示</text>`:''}
    <circle cx="${N[path[0]][0]}" cy="${N[path[0]][1]}" r="5" fill="var(--road)" ${near&&path[0]==='home'?'mask="url(#'+maskId+')"':''}/>
    <circle cx="${N[path.at(-1)][0]}" cy="${N[path.at(-1)][1]}" r="5" fill="var(--orange)" ${near&&path.at(-1)==='home'?'mask="url(#'+maskId+')"':''}/></svg>`;
}

    :`<div class="note">${ic('info',16)}<div>立ち寄りを登録すると、写真を地図にピンとして残せます。</div></div>`}
  <div class="field"><label for="s-com">メモ</label><textarea id="s-com" maxlength="120" placeholder="路面や景色、駐輪場所のことなど"></textarea></div>
  <div class="row"><button class="btn primary" data-act="save-ride">マイ地図に保存</button><button class="btn" data-act="close">戻る</button></div>`);
}
function albumSheet(id){
  const r=S.rides.find(x=>x.id===id); if(!r) return; const firsts=edgesOf(r.path).filter(x=>!traveled(r.id).has(x));
  const hero=photoOf(r.spots[0]||{node:r.path[1]||'A'});
  openSheet(`<div class="album-hero"><img src="${hero}" alt=""><div><b>${esc(r.title||'無題の走行')}</b>${r.date} · ${esc(r.bike)}${r.sample?' · サンプル':''}</div></div>
  <div class="stats"><div class="stat"><small>走行距離</small><b>${kmOf(r.path)}<span>km</span></b></div><div class="stat"><small>初めての道</small><b>${new Set(firsts).size}<span>本</span></b></div><div class="stat"><small>立ち寄り</small><b>${r.spots.length}<span>か所</span></b></div></div>
  ${r.spots.length?`<div class="timeline">${[...r.spots].sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(s=>`<div class="ev"><img src="${photoOf(s)}" alt=""><div><small>${s.time||''}</small><b>${esc(s.title||N[s.node][2])}</b><small>${N[s.node][2]}</small></div></div>`).join('')}</div>`:''}
  ${r.comment?`<p class="lead">${esc(r.comment)}</p>`:''}
  <div class="row"><button class="btn brand" data-act="replay-ride" data-id="${r.id}">${ic('play',14)} 白地図でリプレイ</button><button class="btn" data-act="invite-ride" data-id="${r.id}">${ic('mail',16)} 招待状にする</button></div>
  <div class="row">${U.confirm==='del-'+r.id?`<button class="btn small danger" data-act="del-yes" data-id="${r.id}">この記録を削除する</button><button class="btn small" data-act="del-no" data-id="${r.id}">やめる</button>`:`<button class="btn small danger" data-act="del" data-id="${r.id}">記録を削除</button>`}<button class="btn small" data-act="close">閉じる</button></div>`);
}

/* ---------- リプレイ ---------- */
let replayTimers=[];
function runReplay(list,captions){
  replayTimers.forEach(clearTimeout); replayTimers=[];
  const gap=reduce?0:1.9; U.replay=list.map((r,i)=>({path:r.path,spots:r.spots,delay:i*gap})); U.replay.caption=captions[0];
  U.tab='map'; render();
  if(reduce){ U.replay=null; render(); return; }
  list.forEach((r,i)=>replayTimers.push(setTimeout(()=>{ const c=document.getElementById('replaycap'); if(c) c.textContent=captions[i+1]||''; }, i*gap*1000+200)));
  replayTimers.push(setTimeout(()=>{ U.replay=null; render(); }, (list.length*gap+1.6)*1000));
}

/* ---------- 全体描画・操作 ---------- */
const TABS=[['map','マップ','map'],['rec','記録','rec'],['plan','提案','plan'],['invite','招待状','mail'],['log','履歴','log']];
function render(){
  document.getElementById('m-navi').setAttribute('aria-pressed',U.mode==='navi');
  document.getElementById('m-white').setAttribute('aria-pressed',U.mode==='white');
  document.getElementById('tabs').innerHTML=TABS.map(([id,t,i])=>`<button data-go="${id}" ${U.tab===id?'aria-current="page"':''}>${ic(i,22)}${t}</button>`).join('');
  const p=document.getElementById('panel'), keep=p.dataset.tab===U.tab?p.scrollTop:0;
  p.innerHTML=({map:panelMap,rec:panelRec,plan:panelPlan,invite:panelInvite,log:panelLog})[U.tab]();
  p.dataset.tab=U.tab; p.scrollTop=keep;
  renderMap();
}
let toastT; function toast(msg){ document.querySelector('.toast')?.remove(); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.getElementById('app').appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3200); }

document.getElementById('m-navi').onclick=()=>{U.mode='navi';render();};
document.getElementById('m-white').onclick=()=>{U.mode='white';render();};

document.getElementById('app').addEventListener('click', async ev=>{
  const t=ev.target.closest('button'); if(!t) return;
  if(t.dataset.go){ if(U.rec && t.dataset.go!=='rec'){ toast('記録中です。先に走行を終えるか、記録をやめてください'); return; } U.tab=t.dataset.go; U.confirm=null; render(); return; }
  if(t.dataset.step){ step(t.dataset.step); return; }
  if(t.dataset.cand){ U.selCand=+t.dataset.cand; render(); return; }
  if(t.dataset.bike){ U.bikeFilter=t.dataset.bike; U.logRide=null; render(); return; }
  if(t.dataset.ride){ U.logRide=t.dataset.ride; U.confirm=null; render(); albumSheet(t.dataset.ride); return; }
  if(t.dataset.invride){ U.invRide=t.dataset.invride; render(); return; }
  const a=t.dataset.act, id=t.dataset.id;
  switch(a){
    case 'grow': { const rs=ridesSorted(); runReplay(rs,['初めての起動',...rs.map(r=>`${r.date} ${r.title||''}`)]); break; }
    case 'reset': U.confirm='reset'; render(); break;
    case 'cancel': U.confirm=null; render(); break;
    case 'reset-yes': S.rides=S.rides.filter(r=>!r.sample); U.confirm=null; U.logRide=null; U.invRide=null; U.cands=[]; save(); render(); toast('白紙の地図になりました。記録タブから最初の道を走りましょう'); break;
    case 'sample': S.rides.push(...JSON.parse(JSON.stringify(SAMPLE)).filter(s=>!S.rides.some(r=>r.id===s.id))); save(); render(); break;
    case 'start': startRec(null); break;
    case 'start-plan': startRec(U.plan.path); break;
    case 'auto': U.rec.auto=true; render(); autoStep(); break;
    case 'undo': if(U.rec.path.length>1){ const b=U.rec.path.pop(); U.rec.clock-=mins(EK[k(b,U.rec.path.at(-1))]); U.rec.spots=U.rec.spots.filter(s=>U.rec.path.includes(s.node)); render(); } break;
    case 'spot': { const n=U.rec.path.at(-1), d=new Date(U.rec.start.getTime()+U.rec.clock*6e4); U.rec.spots.push({node:n,kind:kindFor(n),time:d.toTimeString().slice(0,5)}); render(); toast(`${N[n][2]}を立ち寄りに登録しました`); break; }
    case 'discard': U.rec=null; render(); break;
    case 'finish': saveSheet(); break;
    case 'close': U.confirm=null; closeSheet(); break;
    case 'save-ride': {
      const r=U.rec, sel=document.getElementById('s-bike').value; let bike=sel;
      if(sel==='__new'){ bike=document.getElementById('s-newbike').value.trim(); if(!bike){ document.getElementById('s-newbike').focus(); toast('追加する愛車の名前を入力してください'); return; } if(!S.bikes.includes(bike)) S.bikes.push(bike); }
      const tvb=traveled(), news=new Set(edgesOf(r.path).filter(x=>!tvb.has(x))).size;
      const ride={id:'r'+Date.now(),date:document.getElementById('s-date').value||'2026-11-04',bike,title:document.getElementById('s-title').value.trim(),comment:document.getElementById('s-com').value.trim(),path:r.path,
        spots:r.spots.map((s,i)=>({...s,title:document.getElementById('sp-t-'+i).value.trim()}))};
      S.rides.push(ride); U.rec=null; U.plan=null; U.cands=[]; save(); closeSheet();
      runReplay([ride],[`${ride.date} の走行を描いています`]);
      toast(news?`マイ地図に初めての道が${news}本加わりました`:'記録を保存しました'); break; }
    case 'suggest': suggest(); U.plan = U.cands.length?null:false; render(); break;
    case 'use-plan': U.plan=U.cands[U.selCand]; U.tab='rec'; render(); break;
    case 'inv-save': S.wish=[...new Set([...S.wish,...edgesOf(INVITE.path)])]; S.inviteSaved=true; save(); render(); toast('「行きたい道」として地図に保存しました'); break;
    case 'inv-plan': U.form.mood='sea'; U.form.time='4'; U.tab='plan'; suggest(); render(); break;
    case 'inv-copy': { const r=S.rides.find(x=>x.id===U.invRide); const txt=`【道の招待状】${r.title||'走った道'}（${kmOf(r.path)}km）\n${U.invMsg}\n${r.spots.length?'立ち寄り：'+r.spots.map(s=>s.title||N[s.node][2]).join('、')+'\n':''}— ミチノートより`;
      try{ await navigator.clipboard.writeText(txt); toast('招待状のテキストをコピーしました'); }catch(e){ const p=document.getElementById('inv-preview'); const rg=document.createRange(); rg.selectNodeContents(p); getSelection().removeAllRanges(); getSelection().addRange(rg); toast('コピーできなかったので、ひとことを選択しました'); } break; }
    case 'replay-ride': { closeSheet(); const r=S.rides.find(x=>x.id===id); runReplay([r],[`${r.date} ${r.title||''}`]); break; }
    case 'invite-ride': closeSheet(); U.invRide=id; U.tab='invite'; render(); break;
    case 'del': U.confirm='del-'+id; albumSheet(id); break;
    case 'del-no': U.confirm=null; albumSheet(id); break;
    case 'del-yes': S.rides=S.rides.filter(r=>r.id!==id); U.confirm=null; U.logRide=null; if(U.invRide===id) U.invRide=null; save(); closeSheet(); render(); toast('記録を削除しました'); break;
  }
});
document.getElementById('app').addEventListener('change', async ev=>{
  const t=ev.target;
  if(t.dataset.f){ U.form[t.dataset.f]=t.value; return; }
  if(t.id==='hidehome'){ S.hideHome=t.checked; save(); renderMap(); return; }
  if(t.id==='s-bike'){ document.getElementById('newbike-f').hidden = t.value!=='__new'; return; }
  if(t.dataset.spfile){ const f=t.files[0]; if(!f) return; try{ const url=await readPhoto(f); const i=+t.dataset.spfile; U.rec.spots[i].photo=url; document.getElementById('sp-img-'+i).src=url; }catch(e){ toast('この写真は読み込めませんでした。JPEGかPNGを選んでください'); } }
});
document.getElementById('app').addEventListener('input', ev=>{ if(ev.target.id==='inv-msg'){ U.invMsg=ev.target.value; const p=document.getElementById('inv-preview'); if(p) p.textContent=U.invMsg; } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

render();
})();
</script>
</body>
